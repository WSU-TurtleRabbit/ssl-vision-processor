# Lab field config for the Raspberry Pi network camera.
# Thresholds and tracking use the vision_processor defaults (see config.yml); colors are learned automatically (color: below).
cam_id: 0
bot_heights_file: robot-heights.yml

camera:
  driver: OPENCV
  # Raspberry Pi 4 + HD USB Camera streaming 1920x1080 MJPEG over Ethernet (pi_camera/camstream.py).
  # The Pi switches the camera on when this connects and off when it disconnects.
  # Resolution/fps are set on the Pi (camstream.service), not here.
  path: http://192.168.210.149:8080/stream
  output_width: 768
  output_height: 432

geometry:
  camera_amount: 1
  # Measured 1555 mm vertically from the lens front glass to the mat surface (2026-10-06); see docs/calibration.md "Measuring".
  # The camera is tilted; the calibration solves the angle.
  camera_height: 1555.0
  # TODO recalibrate for this camera: run once without line_corners to get img/0.raw.jpg,
  # then fill in the four line crossings in pixels (see README Setup step 5).
  line_corners:
    - [42.8, 323.4]
    - [141.4, 86.7]
    - [629.0, 76.5]
    - [740.5, 308.4]
  refinement: false
  distortion_lines:
    - [[762.9, 330.2], [599.7, 360.8], [495.7, 371.7], [294.4, 372.3], [129.9, 357.4], [22.4, 341.7]]
    - [[19.0, 343.1], [55.8, 232.9], [97.2, 147.9], [134.6, 80.6]]
    - [[134.6, 81.3], [216.2, 70.4], [327.1, 62.9], [441.3, 58.9], [544.7, 62.3], [642.6, 67.7]]
    - [[641.9, 65.7], [675.9, 128.2], [718.7, 207.1], [758.2, 326.1]]

color:
  # Colors are re-learned every frame from the detected blobs:
  #   new = reference_force * reference + history_force * previous + (rest) * measured
  # The lab gets changing sunlight, so the pull back to the fixed reference colors is kept weak
  # (default 0.1) and colors follow the lighting within a few seconds. k-means still re-bootstraps
  # after misclassifications. Use the UI's "Save learned colors" to refresh the reference colors.
  # If teams/IDs start flipping, raise reference_force again (max 0.5 - history_force/2).
  reference_force: 0.1
  history_force: 0.7
  orange: [216, 108, 54]
  field: [122, 127, 129]
  blue: [0, 128, 255]
  green: [81, 171, 119]
  pink: [191, 71, 110]
  yellow: [255, 128, 0]

network:
  gc_ip: "224.5.23.1"
  gc_port: 10003
  vision_ip: "224.5.23.2"
  vision_port: 10006

stream:
  # Software H.264 encoding costs CPU on the Jetson; the wrapper UI uses debug snapshots instead.
  active: false

debug:
  # Set to true once line_corners are calibrated and the geometry publisher/wrapper runs.
  wait_for_geometry: false
  debug_images: true
  # Refresh the snapshots shown in the UI (raw camera view, used for color picking) once per second.
  # Much shorter intervals cost detection time on the CPU (PoCL) build.
  debug_stream_interval_ms: 1000
