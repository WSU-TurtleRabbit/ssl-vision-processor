# Competition-style TIGERs VisionProcessor config for the local lab field.
cam_id: 0
bot_heights_file: robot-heights.yml

camera:
  driver: OPENCV
  path: /dev/video0
  width: 2560
  height: 720
  output_width: 768
  output_height: 432
  # This Jetson processes the calibrated 768x432 frame in about 31-45 ms.
  # Capture at 25 FPS so frames do not queue behind the detector.
  fps: 25
  fourcc: YUYV
  crop_left_half: true
  exposure: 0.0
  gain: 1.0
  gamma: 1.0
  white_balance: OUTDOOR

geometry:
  camera_amount: 1
  camera_height: 2000.0
  # Centers of the tape X markers: the absolute outside boundary edge.
  outer_line_corners:
    - [53.000, 370.000]
    - [58.000, 59.000]
    - [638.000, 50.000]
    - [639.000, 367.000]
  # Detected inner white-line corners in the 768x432 calibrated frame.
  line_corners:
    - [87.170, 339.600]
    - [92.480, 81.800]
    - [604.250, 76.790]
    - [605.320, 338.990]
  refinement: false
  field_line_threshold: 35
  min_line_segment_length: 80.0
  max_line_segment_offset: 10.0
  max_line_segment_angle: 3.0

thresholds:
  # Lowered from 10.0 on 2026-09-14: at 10.0 the ball produced no blob at all
  # (13 blobs seen, which is just the ten robot markers plus noise) and was
  # detected in 0% of frames. The usable window is narrow - 3.0 still finds no
  # ball, 1.5 and below invents robots - so 2.5 sits close to a cliff and is
  # worth re-checking whenever the lighting changes.
  # Preserve fast-motion marker edges that are softened by the 25 FPS camera.
  # Robot hypotheses remain gated by the five-point geometry, calibrated
  # colors, identity pattern, and confidence checks below.
  circularity: 2.5
  score: 4.0
  blobs: 2000
  # Raised from 0.10 to 0.15 on 2026-09-14. The lower circularity above admits
  # more blobs, and at 0.10 that produced phantom robot ids (4 to 7 ids for the
  # 2 robots actually present). 0.15 gives exactly 2 ids at 0.95 confidence.
  # NOT yet validated under fast motion, which is what 0.10 was chosen for:
  # the robots were stationary during this tuning.
  # Phoenix still requires three consistent observations before establishing a
  # track and independently gates identity, heading, field position, and
  # command freshness.
  min_confidence: 0.15
  min_cam_edge_distance: 120.0
  clipping_tolerance: 10.0
  geometry_tolerance: 10.0

color:
  # Adaptive again as of 2026-09-14, after being frozen (0.0 / 1.0) for fixed
  # lighting. Each frame the live colour is re-blended as
  #   reference_force x (value below) + history_force x (previous) + rest x (observed)
  # so the remaining 0.20 is what tracks the room as the day shifts.
  #
  # Measured over 60 s with the ball out, everything else unchanged:
  #   frozen  (0.00 / 1.00)  ball confidence 0.786
  #   this    (0.10 / 0.70)  ball confidence 0.978
  # Robots were 2.00 per frame at ~0.80 with two clean ids either way.
  #
  # The old comment worried about drifting on partial detections. That is what
  # reference_force guards: it pulls continuously back toward the values below,
  # so drift is bounded rather than free-running. 0.10 anchors harder than 0.05
  # and also measured slightly better, so it is the safer of the two.
  reference_force: 0.10
  history_force: 0.70
  orange: [226, 155, 47]
  # All six sampled from the live frame on 2026-09-14, taking the brightest
  # third of each marker blob: edge pixels blend into the carpet and drag a
  # plain mean toward green. yellow is unchanged because no yellow robot was
  # on the field to measure.
  #
  # Swapping the old values for these changed nothing measurable on its own -
  # with history_force at 1.0 the live colours were frozen at whatever the
  # reference said, and both sets were close enough. They earn their place now
  # that adaptation is on, where they are the anchor it is pulled back toward.
  field: [12, 48, 24]
  yellow: [255, 220, 0]
  blue: [20, 125, 234]
  green: [92, 232, 156]
  pink: [204, 111, 136]

tracking:
  # At 25 FPS the filtered tracker velocity can lag the estimator by about
  # 1 m/s during fast diagonals.  A 35 mm base radius keeps the five known
  # marker searches locked through that transient; identity/color and pattern
  # geometry checks still gate every accepted Robot 4 hypothesis.
  min_tracking_radius: 35.0
  max_bot_acceleration: 6.5
  # Preserve a recently visible ball only through brief robot occlusions.
  ball_occlusion_hold_ms: 200
  ball_occlusion_robot_distance: 300.0

network:
  gc_ip: "224.5.23.1"
  gc_port: 10003
  vision_ip: "224.5.23.2"
  vision_port: 10006

stream:
  # The operator UI uses debug snapshots; software H.264 encoding steals CPU
  # from detection on this Jetson and is not needed for SSL-Vision packets.
  active: false
  raw_feed: false
  ip_base_prefix: 224.5.23.
  ip_base_end: 100
  port: 10100

debug:
  wait_for_geometry: true
  debug_images: true
  # Periodically converting and writing four full debug images introduced
  # ~187 ms vision gaps during high-speed motion.  The last commissioning
  # snapshots are retained in img/; disable periodic writes for live play.
  debug_stream_interval_ms: 100
