# Lab field config for the StereoLabs ZED Box (Orin NX) with its ZED 2i, read through the ZED SDK
# (driver ZED, needs a CUDA build with the SDK, see docs/zed-box/setup.md). Exposure, gain and white
# balance are automatic, so the colour references below adapt (reference/history force 0.10/0.70).
cam_id: 0
bot_heights_file: robot-heights.yml

camera:
  driver: ZED
  id: 0                # or serial: <number> to pin a specific camera
  # Per-eye sensor mode: height 720 = HD720 (1280x720), up to 60 FPS on the ZED 2i.
  width: 1280
  height: 720
  # Measured 2026-10-06, same field, 30 s each: 60 FPS keeps robots 2.00/frame, ball 100 %, confidence
  # unchanged vs 30 FPS, and cuts capture->sent latency 3.9 -> 2.7 ms (~4 ms/frame, 0.7 CPU core).
  fps: 60
  # Resized on the GPU by the ZED SDK. Keep 768x432: processing the full 1280x720 was measured worse
  # (54 FPS, ~15 ms/frame, robot confidence 0.656 -> 0.605, latency 13 ms) with no ball gain.
  output_width: 768
  output_height: 432
  # false = the raw left image, geometrically the same as the old V4L2 left-half crop, so the
  # line_corners below stay valid. true = the SDK's undistorted image (needs new corners).
  rectify: false
  # Automatic exposure/gain (0 = auto) and white balance (OUTDOOR/INDOOR = auto).
  # Manual instead: exposure in ms, gain 0-100, white_balance: {temperature: 2800-6500}.
  exposure: 0.0
  gain: 0.0
  white_balance: OUTDOOR
  name: "zed"

geometry:
  camera_amount: 1
  camera_height: 2000.0
  # Centers of the tape X markers: the absolute outside boundary edge.
  outer_line_corners:
    - [638.0, 50.0]
    - [639.0, 367.0]
    - [53.0, 370.0]
    - [58.0, 59.0]
  # Detected inner white-line corners in the 768x432 calibrated frame.
  line_corners:
    - [638.0, 50.0]
    - [639.0, 367.0]
    - [53.0, 370.0]
    - [58.0, 59.0]
  refinement: false
  field_line_threshold: 35
  min_line_segment_length: 80.0
  max_line_segment_offset: 10.0
  max_line_segment_angle: 3.0
  distortion_lines:
    - [[89.2, 73.5], [222.2, 71.5], [345.2, 68.5], [479.2, 68.5], [602.2, 72.5]]
    - [[607.2, 76.5], [614.2, 134.5], [613.2, 212.5], [611.2, 293.5], [609.2, 350.5]]
    - [[602.2, 349.5], [567.2, 351.5], [430.2, 353.5], [339.2, 350.5], [241.2, 346.5], [85.2, 346.5]]
    - [[82.2, 339.5], [77.2, 280.5], [79.2, 207.5], [84.2, 132.5], [87.2, 81.5]]
  line_corners_include_boundary: true

thresholds:
  # Preserve fast-motion marker edges that are softened by the 25 FPS camera.
  # Robot hypotheses remain gated by the five-point geometry, calibrated
  # colors, identity pattern, and confidence checks below.
  circularity: 10.0
  score: 4.0
  blobs: 2000
  # High-speed marker blur occasionally drops otherwise coherent Robot 4
  # hypotheses below 0.15 for five frames.  Phoenix still requires three
  # consistent observations before establishing a track and independently
  # gates identity, heading, field position, and command freshness.
  min_confidence: 0.10
  min_cam_edge_distance: 120.0
  clipping_tolerance: 10.0
  geometry_tolerance: 10.0

color:
  # Auto exposure/white balance moves the colours, so they adapt: each frame the live colour is
  # reference_force x (value below) + history_force x (previous) + the rest x (observed).
  reference_force: 0.1
  history_force: 0.7
  orange: [176, 163, 36]
  # Carpet as the ZED SDK delivers it (auto exposure), measured 2026-10-06.
  field: [109, 147, 125]
  yellow: [255, 220, 0]
  blue: [45, 190, 255]
  green: [62, 175, 139]
  pink: [138, 114, 124]

tracking:
  # At 25 FPS the filtered tracker velocity can lag the estimator by about
  # 1 m/s during fast diagonals.  A 35 mm base radius keeps the five known
  # marker searches locked through that transient; identity/color and pattern
  # geometry checks still gate every accepted Robot 4 hypothesis.
  min_tracking_radius: 35.0
  max_bot_acceleration: 6.5
  # Preserve a recently visible ball only through brief robot occlusions.
  ball_occlusion_hold_ms: 200
  ball_occlusion_robot_distance: 300.0

network:
  gc_ip: "224.5.23.1"
  gc_port: 10003
  vision_ip: "224.5.23.2"
  vision_port: 10006

stream:
  # The operator UI uses debug snapshots; software H.264 encoding steals CPU
  # from detection on this Jetson and is not needed for SSL-Vision packets.
  active: false
  raw_feed: false
  ip_base_prefix: 224.5.23.
  ip_base_end: 100
  port: 10100

debug:
  wait_for_geometry: true
  debug_images: true
  # Periodically converting and writing four full debug images introduced
  # ~187 ms vision gaps during high-speed motion.  The last commissioning
  # snapshots are retained in img/; disable periodic writes for live play.
  debug_stream_interval_ms: 100
