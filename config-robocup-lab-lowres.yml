# EXPERIMENTAL: lower-resolution, higher-rate capture.
#
# Copy of config-robocup-lab.yml with the camera switched to the ZED's
# 1344x376 stereo mode at 60 fps. Not a drop-in replacement: the geometry
# corners below are scaled rather than measured, so calibration must be
# redone before this is used for anything that matters.
#
# Compare against the working config with:
#   .venv/bin/python vision_probe.py --seconds 30 --label lowres
cam_id: 0
bot_heights_file: robot-heights.yml

camera:
  driver: OPENCV
  path: /dev/video0
  # The ZED 2i only offers side-by-side stereo modes, so the width is always
  # two lenses. 1344x376 is 2x672x376: a quarter of the pixels of 2560x720,
  # which cuts both the USB transfer and the per-frame crop.
  width: 1344
  height: 376
  # Match the cropped half exactly so no rescale is needed at all. The old
  # config captured 1280x720 and resampled down to 768x432 every frame.
  output_width: 672
  output_height: 376
  # 60 is a rate this mode actually offers (100/60/30/15). The previous 25 was
  # not offered at any resolution, so V4L2 silently rounded it to 30 - the
  # queuing the old comment was trying to avoid was happening anyway.
  fps: 60
  fourcc: YUYV
  crop_left_half: true
  exposure: 0.0
  gain: 1.0
  gamma: 1.0
  white_balance: OUTDOOR

geometry:
  camera_amount: 1
  camera_height: 2000.0
  # Centers of the tape X markers: the absolute outside boundary edge.
  # SCALED, NOT MEASURED. These are the 768x432 values multiplied by the
  # resolution change (x0.875, y0.8704). They put the calibration in roughly
  # the right place so the solver has a sane starting point, but corners are
  # pixel coordinates and do not survive a resolution change intact - they
  # must be re-measured against a 672x376 sample image before this config is
  # trusted for play.
  outer_line_corners:
    - [46.380, 322.040]
    - [50.750, 51.350]
    - [558.250, 43.520]
    - [559.120, 319.430]
  # Inner white-line corners in the 672x376 calibrated frame.
  line_corners:
    - [76.270, 295.580]
    - [80.920, 71.200]
    - [528.720, 66.840]
    - [529.660, 295.050]
  refinement: false
  field_line_threshold: 35
  # Pixel-denominated, so scaled with the frame (80 * 0.875).
  min_line_segment_length: 70.0
  max_line_segment_offset: 10.0
  max_line_segment_angle: 3.0

thresholds:
  # Preserve fast-motion marker edges that are softened by the 25 FPS camera.
  # Robot hypotheses remain gated by the five-point geometry, calibrated
  # colors, identity pattern, and confidence checks below.
  circularity: 10.0
  score: 4.0
  blobs: 2000
  # High-speed marker blur occasionally drops otherwise coherent Robot 4
  # hypotheses below 0.15 for five frames.  Phoenix still requires three
  # consistent observations before establishing a track and independently
  # gates identity, heading, field position, and command freshness.
  min_confidence: 0.10
  min_cam_edge_distance: 120.0
  clipping_tolerance: 10.0
  geometry_tolerance: 10.0

color:
  # Fixed field lighting: keep calibrated references from drifting on partial detections.
  reference_force: 0.0
  history_force: 1.0
  orange: [255, 120, 40]
  field: [42, 130, 67]
  yellow: [255, 220, 0]
  blue: [45, 190, 255]
  green: [70, 230, 190]
  pink: [235, 90, 165]

tracking:
  # At 25 FPS the filtered tracker velocity can lag the estimator by about
  # 1 m/s during fast diagonals.  A 35 mm base radius keeps the five known
  # marker searches locked through that transient; identity/color and pattern
  # geometry checks still gate every accepted Robot 4 hypothesis.
  min_tracking_radius: 35.0
  max_bot_acceleration: 6.5
  # Preserve a recently visible ball only through brief robot occlusions.
  ball_occlusion_hold_ms: 200
  ball_occlusion_robot_distance: 300.0

network:
  gc_ip: "224.5.23.1"
  gc_port: 10003
  vision_ip: "224.5.23.2"
  vision_port: 10006

stream:
  # The operator UI uses debug snapshots; software H.264 encoding steals CPU
  # from detection on this Jetson and is not needed for SSL-Vision packets.
  active: false
  raw_feed: false
  ip_base_prefix: 224.5.23.
  ip_base_end: 100
  port: 10100

debug:
  wait_for_geometry: true
  debug_images: true
  # Periodically converting and writing four full debug images introduced
  # ~187 ms vision gaps during high-speed motion.  The last commissioning
  # snapshots are retained in img/; disable periodic writes for live play.
  debug_stream_interval_ms: 100
